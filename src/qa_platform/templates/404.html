{% extends "base.html" %}

{% block title %}Página no encontrada | Plataforma Q&A{% endblock %}

{% block content %}
<section class="card error-state">
  <h1 class="error-code tabular-nums">404</h1>
  <h2>Página no encontrada</h2>
  <p>La pregunta o recurso que estás buscando no existe o fue movido.</p>
  <a href="{{ url_for('questions.list_questions') }}" class="btn btn-primary">
    Volver al listado de preguntas
  </a>
</section>
{% endblock %}
